stages:
  - build-image
  - build-test

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH =~ /^(feature|test)\//'
    - when: never

variables:
  GIT_DEPTH: "1"
  GIT_SUBMODULE_STRATEGY: none
  VCPKG_BINARY_SOURCES: "clear;files,$CI_PROJECT_DIR/.vcpkg-cache,readwrite"
  VCPKG_DISABLE_METRICS: "1"
  DOCKER_IMAGE: "$CI_REGISTRY_IMAGE/ci:latest"

build-ci-image:
  stage: build-image
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  interruptible: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: [.gitlab/ci/Dockerfile]
    - if: '$CI_COMMIT_BRANCH'
      changes: [.gitlab/ci/Dockerfile]
    - when: manual
      allow_failure: true
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
    - >-
      /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/.gitlab/ci/Dockerfile"
      --destination "$DOCKER_IMAGE"
      --cache=true

build-and-test:
  stage: build-test
  image: "$DOCKER_IMAGE"
  interruptible: true
  needs:
    - job: build-ci-image
      optional: true
  cache:
    - key:
        files:
          - vcpkg.json
          - vcpkg-configuration.json
      paths:
        - .vcpkg-cache/
      policy: pull-push
  before_script:
    - mkdir -p .vcpkg-cache
    - 'test -n "$VCPKG_ROOT" || { echo "VCPKG_ROOT missing from image"; exit 1; }'
    - 'test -n "$VULKAN_SDK" || { echo "VULKAN_SDK missing from image"; exit 1; }'
    - 'test -n "$DOTNET_ROOT" || { echo "DOTNET_ROOT missing from image"; exit 1; }'
    - premake5 --version | grep '5.0.0-beta8'
  script:
    - python3 Scripts/Setup.py --action ninja --compiler clang --yes
    - ninja EppoEngineTesting_Debug_x64
    - ctest --test-dir build/bin/Debug-linux-x86_64 --label-exclude graphical --output-on-failure --output-junit "$CI_PROJECT_DIR/build/bin/Debug-linux-x86_64/report.xml"
  artifacts:
    when: always
    reports:
      junit: build/bin/Debug-linux-x86_64/report.xml
    paths:
      - build/bin/Debug-linux-x86_64/report.xml
    expire_in: 1 week
